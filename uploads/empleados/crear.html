<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar empleado</title>
</head>
<body>
<main>
    <h1>Registrar empleado</h1>

    <form th:action="@{/admin/empleados}"
          th:object="${empleado}"
          method="post"
          enctype="multipart/form-data">

        <div th:if="${#fields.hasAnyErrors()}" role="alert">
            <p>Revisa los siguientes datos:</p>
            <ul>
                <li th:each="error : ${#fields.allErrors()}"
                    th:text="${error}"></li>
            </ul>
        </div>

        <fieldset>
            <legend>Datos personales</legend>

            <p>
                <label for="nombres">Nombres</label>
                <input id="nombres" type="text" th:field="*{nombres}"
                       maxlength="100" required>
            </p>

            <p>
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" type="text" th:field="*{apellidos}"
                       maxlength="100" required>
            </p>

            <p>
                <label for="dni">DNI</label>
                <input id="dni" type="text" th:field="*{dni}"
                       inputmode="numeric" pattern="[0-9]{8}"
                       maxlength="8" required>
            </p>

            <p>
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input id="fechaNacimiento" type="date"
                       th:field="*{fechaNacimiento}" required>
            </p>

            <p>
                <label for="telefono">Teléfono</label>
                <input id="telefono" type="tel" th:field="*{telefono}"
                       maxlength="20">
            </p>

            <p>
                <label for="direccion">Dirección</label>
                <input id="direccion" type="text" th:field="*{direccion}"
                       maxlength="255">
            </p>

            <p>
                <label for="referencia">Referencia</label>
                <input id="referencia" type="text" th:field="*{referencia}"
                       maxlength="255">
            </p>

            <p>
                <label for="foto">Foto opcional</label>
                <input id="foto" type="file" name="foto"
                       accept="image/jpeg,image/png"
                       aria-describedby="fotoAyuda">
                <small id="fotoAyuda">
                    JPEG o PNG, máximo 5 MB y 12 megapíxeles.
                    Sin foto se mostrará el avatar por defecto.
                    Si hay errores, selecciona el archivo nuevamente.
                </small>
            </p>
        </fieldset>

        <fieldset>
            <legend>Cuenta de acceso</legend>

            <p>
                <label for="email">Correo</label>
                <input id="email" type="email" th:field="*{email}"
                       maxlength="254" required>
            </p>

            <p>
                <label for="password">Contraseña</label>
                <!-- No se devuelve la contraseña tras errores. -->
                <input id="password" type="password" name="password"
                       minlength="8" maxlength="64"
                       autocomplete="new-password" required>
            </p>

            <fieldset>
                <legend>Roles: selecciona al menos uno</legend>

                <div th:each="rol : ${rolesDisponibles}">
                    <label>
                        <input type="checkbox"
                               th:field="*{roles}"
                               th:value="${rol}">
                        <span th:text="${rol.name()}"></span>
                    </label>
                </div>
            </fieldset>
        </fieldset>

        <p>
            <button type="submit">Registrar</button>
            <a th:href="@{/admin/empleados}">Cancelar</a>
        </p>
    </form>
</main>
</body>
</html>
