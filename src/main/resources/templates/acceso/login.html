
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - CiberMax</title>
    <style>
        body { font-family: sans-serif; margin: 2rem auto; max-width: 28rem; padding: 0 1rem; }
        form { display: grid; gap: .75rem; }
        input, button { box-sizing: border-box; font: inherit; padding: .65rem; width: 100%; }
        .mensaje { margin-bottom: 1rem; padding: .75rem; }
        .error { background: #fee2e2; color: #991b1b; }
        .ok { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<h2>Iniciar sesión - CiberMax</h2>

<div class="mensaje error" th:if="${param.error}">
    Correo o contraseña incorrectos.
</div>

<div class="mensaje ok" th:if="${param.logout}">
    Sesión cerrada correctamente.
</div>

<div class="mensaje ok" th:if="${param.registered}">
    Registro completado. Ya puedes iniciar sesión.
</div>

<div class="mensaje error" th:if="${param.expired}">
    Tu sesión expiró. Inicia sesión nuevamente.
</div>

<form th:action="@{/admin/login}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label for="email">Correo electrónico</label>
    <input
            type="email"
            id="email"
            name="email"
            required
    >

    <label for="password">Contraseña</label>
    <input
            type="password"
            id="password"
            name="password"
            required
    >

    <button type="submit">
        Iniciar sesión
    </button>

</form>

</body>
</html>
