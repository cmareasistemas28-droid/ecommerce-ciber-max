
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del empleado | CiberMax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Detalle del empleado</h2>

        <a th:href="@{/admin/empleados}"
           class="btn btn-outline-secondary">
            Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div class="d-flex align-items-center gap-4 mb-4">

                <div th:if="${empleado.foto() != null}">
                    <img th:src="${empleado.foto()}"
                         alt="Fotografía del empleado"
                         class="rounded-circle border"
                         style="width:110px;height:110px;object-fit:cover">
                </div>

                <div>
                    <h3 th:text="${empleado.nombres() + ' ' + empleado.apellidos()}">
                    </h3>

                    <p class="text-muted mb-2"
                       th:text="${empleado.email()}">
                    </p>

                    <span th:if="${empleado.active()}"
                          class="badge bg-success">
                        Activo
                    </span>

                    <span th:unless="${empleado.active()}"
                          class="badge bg-secondary">
                        Inactivo
                    </span>
                </div>

            </div>

            <hr>

            <h5 class="mb-3">Información personal</h5>

            <div class="row g-4">

                <div class="col-md-6">
                    <strong>DNI</strong>
                    <p th:text="${empleado.dni()}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Fecha de nacimiento</strong>
                    <p th:text="${empleado.fechaNacimiento() != null ? #temporals.format(empleado.fechaNacimiento(), 'dd/MM/yyyy') : '-'}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Edad</strong>
                    <p th:text="${empleado.edad() != null ? empleado.edad() + ' años' : '-'}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Teléfono</strong>
                    <p th:text="${empleado.telefono() ?: '-'}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Dirección</strong>
                    <p th:text="${empleado.direccion() ?: '-'}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Referencia</strong>
                    <p th:text="${empleado.referencia() ?: '-'}"></p>
                </div>

            </div>

            <hr>

            <h5 class="mb-3">Información de acceso</h5>

            <div class="row g-3">

                <div class="col-md-6">
                    <strong>Correo electrónico</strong>
                    <p th:text="${empleado.email()}"></p>
                </div>

                <div class="col-md-6">
                    <strong>Roles asignados</strong>

                    <div>
                        <span th:each="rol : ${empleado.roles()}"
                              th:text="${rol.name()}"
                              class="badge bg-primary me-1">
                        </span>
                    </div>
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">

                <a th:href="@{/admin/empleados/{id}/editar(id=${empleado.id()})}"
                   class="btn btn-primary">
                    Editar empleado
                </a>

                <a th:href="@{/admin/empleados}"
                   class="btn btn-secondary">
                    Regresar al listado
                </a>

            </div>

        </div>
    </div>

</div>

</body>
</html>
