
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar empleado | CiberMax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Registrar empleado</h2>
            <p class="text-muted mb-0">
                Completa la información del nuevo empleado.
            </p>
        </div>

        <a th:href="@{/admin/empleados}"
           class="btn btn-outline-secondary">
            Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/admin/empleados}"
                  th:object="${empleado}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">
                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}">
                    </div>
                </div>

                <h5 class="mb-3">Datos personales</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombres *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombres}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{nombres}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellidos *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{apellidos}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{apellidos}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">DNI *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{dni}"
                               minlength="8"
                               maxlength="8"
                               pattern="[0-9]{8}"
                               inputmode="numeric"
                               required>
                        <div class="text-danger small"
                             th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha de nacimiento *</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{fechaNacimiento}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{fechaNacimiento}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="tel"
                               class="form-control"
                               th:field="*{telefono}"
                               maxlength="20">
                        <div class="text-danger small"
                             th:errors="*{telefono}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Dirección</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{direccion}"
                               maxlength="255">
                        <div class="text-danger small"
                             th:errors="*{direccion}"></div>
                    </div>

                    <div class="col-12" th:if="${esAdministrador}">
                        <label class="form-label">Referencia</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{referencia}"
                               maxlength="255">
                        <div class="text-danger small"
                             th:errors="*{referencia}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Fotografía</label>
                        <input type="file"
                               class="form-control"
                               th:field="*{foto}"
                               accept="image/*">
                        <div class="text-danger small"
                             th:errors="*{foto}"></div>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="mb-3">Credenciales de acceso</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico *</label>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               maxlength="100"
                               autocomplete="off"
                               required>
                        <div class="text-danger small"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contraseña *</label>
                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               minlength="4"
                               autocomplete="new-password"
                               required>
                        <div class="text-danger small"
                             th:errors="*{password}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label d-block">
                            Roles del empleado *
                        </label>

                        <div class="form-check"
                             th:each="rol : ${rolesDisponibles}">

                            <input type="checkbox"
                                   class="form-check-input"
                                   th:field="*{roles}"
                                   th:value="${rol.name()}">

                            <label class="form-check-label"
                                   th:text="${rol.name()}">
                            </label>
                        </div>

                        <div class="text-danger small"
                             th:errors="*{roles}"></div>
                    </div>

                    <input th:if="${!esAdministrador}"
                           type="hidden"
                           name="roles"
                           value="VENDEDOR">

                    <div class="alert alert-info" th:if="${!esAdministrador}">
                        El registro público crea un empleado con rol VENDEDOR.
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/empleados}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Guardar empleado
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
