
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar empleado | CiberMax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Editar empleado</h2>

        <a th:href="@{/admin/empleados}"
           class="btn btn-outline-secondary">
            Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/admin/empleados/{id}/editar(id=${empleadoId})}"
                  th:object="${empleado}"
                  method="post"
                  enctype="multipart/form-data">

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">
                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}">
                    </div>
                </div>

                <h5>Datos personales</h5>
                <hr>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombres *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombres}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{nombres}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellidos *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{apellidos}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{apellidos}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">DNI *</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{dni}"
                               maxlength="8"
                               minlength="8"
                               pattern="[0-9]{8}"
                               required>
                        <div class="text-danger small"
                             th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{fechaNacimiento}">
                        <div class="text-danger small"
                             th:errors="*{fechaNacimiento}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="tel"
                               class="form-control"
                               th:field="*{telefono}"
                               maxlength="20">
                        <div class="text-danger small"
                             th:errors="*{telefono}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Dirección</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{direccion}"
                               maxlength="255">
                        <div class="text-danger small"
                             th:errors="*{direccion}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Referencia</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{referencia}"
                               maxlength="255">
                        <div class="text-danger small"
                             th:errors="*{referencia}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Fotografía actual</label>

                        <div th:if="${fotoActual != null and !#strings.isEmpty(fotoActual)}"
                             class="mb-2">
                            <img th:src="${fotoActual}"
                                 alt="Fotografía actual"
                                 class="rounded border"
                                 style="width:100px;height:100px;object-fit:cover">
                        </div>

                        <input type="file"
                               class="form-control"
                               th:field="*{foto}"
                               accept="image/*">

                        <small class="text-muted">
                            Dejar vacío para conservar la fotografía actual.
                        </small>
                        <div class="text-danger small"
                             th:errors="*{foto}"></div>
                    </div>

                </div>

                <hr class="my-4">

                <h5>Datos de acceso</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico *</label>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               maxlength="100"
                               required>
                        <div class="text-danger small"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label d-block">Roles *</label>

                        <div class="form-check"
                             th:each="rol : ${rolesDisponibles}">

                            <input type="checkbox"
                                   class="form-check-input"
                                   th:field="*{roles}"
                                   th:value="${rol.name()}">

                            <label class="form-check-label"
                                   th:text="${rol.name()}"></label>

                        </div>

                        <div class="text-danger small"
                             th:errors="*{roles}"></div>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/empleados}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Guardar cambios
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
