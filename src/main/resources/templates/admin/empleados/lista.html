
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empleados | CiberMax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Gestión de empleados</h2>
            <p class="text-muted mb-0">
                Administración del personal de CiberMax
            </p>
        </div>

        <a th:href="@{/admin/empleados/nuevo}"
           class="btn btn-primary">
            + Nuevo empleado
        </a>
    </div>

    <div th:if="${mensaje}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Empleado</th>
                        <th>DNI</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="empleado : ${pagina.content}">

                        <td>
                            <div class="fw-semibold"
                                 th:text="${empleado.nombres() + ' ' + empleado.apellidos()}">
                            </div>
                        </td>

                        <td th:text="${empleado.dni()}"></td>

                        <td th:text="${empleado.email()}"></td>

                        <td th:text="${empleado.telefono() != null ? empleado.telefono() : '-'}"></td>

                        <td>
                            <span th:if="${empleado.active()}"
                                  class="badge bg-success">
                                Activo
                            </span>

                            <span th:unless="${empleado.active()}"
                                  class="badge bg-secondary">
                                Inactivo
                            </span>
                        </td>

                        <td>
                            <div class="d-flex flex-wrap gap-2">

                                <a th:href="@{/admin/empleados/{id}(id=${empleado.id()})}"
                                   class="btn btn-sm btn-outline-info">
                                    Ver
                                </a>

                                <a th:href="@{/admin/empleados/{id}/editar(id=${empleado.id()})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Editar
                                </a>

                                <form th:if="${empleado.active()}"
                                      th:action="@{/admin/empleados/{id}/desactivar(id=${empleado.id()})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('¿Desactivar empleado?')">
                                        Desactivar
                                    </button>
                                </form>

                                <form th:unless="${empleado.active()}"
                                      th:action="@{/admin/empleados/{id}/activar(id=${empleado.id()})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-success">
                                        Activar
                                    </button>
                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${pagina.empty}">
                        <td colspan="6"
                            class="text-center text-muted py-4">
                            No hay empleados registrados.
                        </td>
                    </tr>

                    </tbody>
                </table>

            </div>

            <div class="d-flex justify-content-between align-items-center mt-3"
                 th:if="${pagina.totalPages > 0}">

                <span class="text-muted small"
                      th:text="|Total: ${pagina.totalElements} empleados|">
                </span>

                <nav>
                    <ul class="pagination mb-0">

                        <li class="page-item"
                            th:classappend="${pagina.first} ? 'disabled'">

                            <a class="page-link"
                               th:if="${!pagina.first}"
                               th:href="@{/admin/empleados(page=${pagina.number - 1})}">
                                Anterior
                            </a>
                            <span class="page-link"
                                  th:if="${pagina.first}">
                                Anterior
                            </span>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                            th:classappend="${i == pagina.number} ? 'active'">

                            <a class="page-link"
                               th:href="@{/admin/empleados(page=${i})}"
                               th:text="${i + 1}">
                            </a>
                        </li>

                        <li class="page-item"
                            th:classappend="${pagina.last} ? 'disabled'">

                            <a class="page-link"
                               th:if="${!pagina.last}"
                               th:href="@{/admin/empleados(page=${pagina.number + 1})}">
                                Siguiente
                            </a>
                            <span class="page-link"
                                  th:if="${pagina.last}">
                                Siguiente
                            </span>
                        </li>

                    </ul>
                </nav>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
