server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
spring:
  application:
    name: ecommerce
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

app:
  storage:
    location: ${UPLOAD_DIR:./uploads}
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_INITIAL_EMAIL:}
      password: ${ADMIN_INITIAL_PASSWORD:}
      nombres: ${ADMIN_INITIAL_NOMBRES:}
      apellidos: ${ADMIN_INITIAL_APELLIDOS:}
      dni: ${ADMIN_INITIAL_DNI:}
      fecha-nacimiento: ${ADMIN_INITIAL_FECHA_NACIMIENTO:}
      telefono: ${ADMIN_INITIAL_TELEFONO:}
      direccion: ${ADMIN_INITIAL_DIRECCION:}
      referencia: ${ADMIN_INITIAL_REFERENCIA:}
