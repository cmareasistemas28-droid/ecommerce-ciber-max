server:
  port: ${SERVER_PORT}
spring:
  application:
    name: ecommerce
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

app:
  storage:
    location: ${UPLOAD_DIR:./uploads}